<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NefroPase Cloud - Hemodiálisis</title>
  <!-- Firebase App & Firestore SDKs (Compat v9) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <style>
    :root {
      --primary: #1976d2;
      --primary-dark: #115293;
      --secondary: #26a69a;
      --accent: #ff9800;
      --bg: #f4f6f9;
      --card-bg: #ffffff;
      --text: #212529;
      --text-muted: #6c757d;
      --border: #dee2e6;
      --danger: #e53935;
      --success: #43a047;
      --radius: 8px;
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 50px; }

    /* Top Navigation Bar */
    header.navbar {
      background: #0d47a1;
      color: white;
      padding: 0.75rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .brand { font-size: 1.25rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .brand span { font-size: 0.85rem; font-weight: 400; background: rgba(255,255,255,0.2); padding: 2px 8px; border-radius: 12px; }
    .navbar-actions { display: flex; align-items: center; gap: 12px; }

    .btn-top-solicitud {
      background-color: #ff9800;
      color: #fff;
      border: none;
      padding: 7px 14px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-top-solicitud:hover { background-color: #f57c00; transform: translateY(-1px); }

    .btn-sync {
      background-color: rgba(255,255,255,0.15);
      color: white;
      border: 1px solid rgba(255,255,255,0.3);
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 0.82rem;
      cursor: pointer;
    }
    .btn-sync:hover { background-color: rgba(255,255,255,0.25); }

    .notification-badge {
      position: relative;
      background: rgba(255,255,255,0.15);
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.1rem;
    }
    .badge-count {
      position: absolute;
      top: -2px;
      right: -2px;
      background: var(--danger);
      color: white;
      font-size: 0.65rem;
      font-weight: bold;
      padding: 2px 5px;
      border-radius: 10px;
    }

    /* Main Container */
    .container { max-width: 1300px; margin: 1.5rem auto; padding: 0 1rem; }

    /* Barra de Búsqueda y Filtros */
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.5rem;
      background: white;
      padding: 1rem;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .search-input {
      flex: 1;
      min-width: 250px;
      padding: 9px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 0.95rem;
    }
    .toolbar-actions { display: flex; gap: 10px; }
    .btn {
      padding: 8px 14px;
      border-radius: var(--radius);
      border: none;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.2s;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-outline:hover { background: #eee; }

    /* Grid de Pacientes */
    .patients-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 1.25rem;
    }

    /* Tarjeta Paciente */
    .patient-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border-top: 4px solid var(--primary);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .patient-card:hover { transform: translateY(-2px); box-shadow: 0 8px 16px rgba(0,0,0,0.12); }
    .card-header {
      padding: 1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      background: #fafafa;
    }
    .cama-badge {
      background: #e3f2fd;
      color: #0d47a1;
      font-size: 0.9rem;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid #bbdefb;
    }
    .patient-name { font-size: 1.05rem; font-weight: 700; color: #1a237e; margin-bottom: 2px; }
    .patient-meta { font-size: 0.8rem; color: var(--text-muted); }

    .card-body { padding: 1rem; flex: 1; display: flex; flex-direction: column; gap: 8px; font-size: 0.88rem; }
    .info-row { display: flex; justify-content: space-between; }
    .info-label { color: var(--text-muted); font-weight: 500; }
    .info-val { font-weight: 600; text-align: right; }
    .dx-text {
      background: #f8f9fa;
      border-left: 3px solid var(--accent);
      padding: 6px 10px;
      font-size: 0.82rem;
      border-radius: 0 4px 4px 0;
      color: #37474f;
    }

    .card-footer {
      padding: 0.75rem 1rem;
      border-top: 1px solid var(--border);
      background: #fafafa;
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }
    .btn-solicitud-card {
      background: #e0f2fe;
      color: #0369a1;
      border: 1px solid #bae6fd;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.82rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      width: 100%;
      justify-content: center;
      transition: all 0.2s;
    }
    .btn-solicitud-card:hover { background: #0284c7; color: white; border-color: #0284c7; }

    /* Modales */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 1rem;
      backdrop-filter: blur(2px);
    }
    .modal-content {
      background: white;
      border-radius: 12px;
      width: 100%;
      max-width: 780px;
      max-height: 92vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2);
      overflow: hidden;
    }
    .modal-header {
      padding: 1rem 1.5rem;
      background: #f8fafc;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-header h3 { font-size: 1.15rem; color: #0f172a; }
    .btn-close { background: none; border: none; font-size: 1.25rem; cursor: pointer; color: #64748b; }
    .btn-close:hover { color: #0f172a; }

    .modal-body { padding: 1.25rem 1.5rem; overflow-y: auto; flex: 1; }
    .modal-footer {
      padding: 1rem 1.5rem;
      background: #f8fafc;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    /* Selector de laboratorios */
    .perfil-rutina-box {
      margin-bottom: 1rem;
    }
    .btn-rutina {
      width: 100%;
      background: linear-gradient(135deg, #0d47a1, #1976d2);
      color: white;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 6px rgba(25,118,210,0.25);
      transition: all 0.2s;
    }
    .btn-rutina:hover { opacity: 0.92; transform: translateY(-1px); }
    .btn-rutina.active {
      background: linear-gradient(135deg, #1b5e20, #2e7d32);
      box-shadow: 0 4px 6px rgba(46,125,50,0.3);
    }

    .grid-labs {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 8px;
      margin-bottom: 1.25rem;
    }
    .btn-lab-item {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      color: #334155;
      padding: 8px 6px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
      user-select: none;
    }
    .btn-lab-item:hover { background: #e2e8f0; border-color: #94a3b8; }
    .btn-lab-item.selected {
      background: #0284c7;
      color: white;
      border-color: #0369a1;
      box-shadow: 0 2px 4px rgba(2,132,199,0.3);
    }

    .preview-box {
      background: #fafafa;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
    }
    .preview-box label { font-size: 0.78rem; font-weight: 700; color: #475569; text-transform: uppercase; display: block; margin-bottom: 4px; }
    .preview-box textarea {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 8px;
      font-size: 0.85rem;
      resize: vertical;
      color: #1e293b;
      font-family: inherit;
    }

    /* Modal Form Nuevo Paciente / Búsqueda */
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.82rem; font-weight: 600; color: #475569; margin-bottom: 4px; }
    .form-control {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.9rem;
    }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .patient-search-results {
      max-height: 200px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-top: 8px;
    }
    .search-result-item {
      padding: 8px 12px;
      border-bottom: 1px solid #f1f5f9;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
    }
    .search-result-item:hover { background: #f8fafc; }
    .search-result-item:last-child { border-bottom: none; }

    /* ESTILOS DE IMPRESIÓN (FORMATO EXACTO ISSSTE HOSPITAL REGIONAL PUEBLA) */
    @media print {
      body * { visibility: hidden; }
      #printableArea, #printableArea * { visibility: visible; }
      #printableArea {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        margin: 0;
        padding: 0;
      }
      @page {
        size: letter portrait;
        margin: 8mm 12mm;
      }
    }

    .solicitud-print-page {
      font-family: Arial, Helvetica, sans-serif;
      color: #000;
      display: flex;
      flex-direction: column;
      gap: 14mm;
    }

    .form-tanto {
      border: 1.8px solid #000;
      padding: 7px 10px;
      box-sizing: border-box;
      background: #fff;
    }

    .issste-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1.5px solid #000;
      padding-bottom: 4px;
      margin-bottom: 4px;
    }
    .issste-brand {
      font-size: 11px;
      line-height: 1.15;
    }
    .issste-brand strong { font-size: 13px; font-weight: 900; }
    .issste-sub { font-size: 9px; text-transform: uppercase; font-weight: bold; }
    .issste-meta {
      text-align: right;
      font-size: 8px;
      line-height: 1.2;
      font-weight: bold;
    }

    .doc-banner {
      text-align: center;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.5px;
      margin: 4px 0 6px 0;
      text-transform: uppercase;
    }

    .issste-grid-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 9.5px;
    }
    .issste-grid-table td {
      border: 1px solid #000;
      padding: 3px 5px;
      vertical-align: top;
    }
    .label-cell {
      font-size: 8px;
      font-weight: bold;
      color: #000;
      text-transform: uppercase;
      display: block;
      margin-bottom: 1px;
    }
    .value-cell {
      font-size: 10px;
      font-weight: bold;
    }

    .analisis-box {
      height: 95px;
      vertical-align: top;
    }
    .analisis-content {
      font-size: 10px;
      font-weight: bold;
      line-height: 1.25;
      margin-top: 3px;
      text-transform: uppercase;
    }

    .consentimiento-text {
      font-size: 7.5px;
      line-height: 1.15;
      text-align: justify;
    }
    .firma-area {
      height: 38px;
      border-bottom: 1px solid #000;
      margin-bottom: 2px;
    }
    .firma-sub {
      font-size: 8px;
      text-align: center;
      font-weight: bold;
    }
    .compromiso-tag {
      font-size: 8px;
      font-weight: bold;
      text-align: center;
      margin-top: 3px;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <!-- Barra de Navegación Superior -->
  <header class="navbar">
    <div class="brand">
      NefroPase Cloud <span>ISSSTE Puebla</span>
    </div>
    <div class="navbar-actions">
      <!-- Botón en la misma línea de notificaciones para nueva solicitud -->
      <button class="btn-top-solicitud" onclick="abrirModalBusquedaSolicitud()" title="Generar Solicitud de Laboratorios">
        📋 + Solicitud Lab
      </button>
      <button class="btn-sync" onclick="mostrarInstruccionesSync()" title="Sincronización con Drive">
        🔄 Drive Sync
      </button>
      <div class="notification-badge" onclick="alert('No hay pendientes críticos al momento.')">
        🔔
        <span class="badge-count" id="badgeCount">0</span>
      </div>
    </div>
  </header>

  <!-- Contenedor Principal -->
  <main class="container">
    <section class="toolbar">
      <input type="text" id="filtroGeneral" class="search-input" placeholder="Buscar paciente por nombre, cama o expediente..." oninput="filtrarPacientes()">
      <div class="toolbar-actions">
        <button class="btn btn-outline" onclick="abrirModalNuevoPaciente()">+ Registrar Paciente</button>
      </div>
    </section>

    <!-- Listado / Cuadrícula de pacientes -->
    <section id="pacientesContainer" class="patients-grid">
      <!-- Se inyectan dinámicamente -->
    </section>
  </main>

  <!-- MODAL: SELECCIÓN DE LABORATORIOS (CON BOTONES Y DESGLOSE) -->
  <div id="modalSolicitudLabs" class="modal-overlay" style="display:none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalLabHeader">Solicitud de Análisis Clínicos</h3>
        <button class="btn-close" onclick="cerrarModalLabs()">✕</button>
      </div>
      <div class="modal-body">
        
        <!-- Botón Perfil RUTINA -->
        <div class="perfil-rutina-box">
          <button type="button" id="btnRutina" class="btn-rutina" onclick="toggleRutina()">
            ★ PERFIL RUTINA (BH, QS, ES, ALB, AU, HBA1C, TIEMPOS, PFH, LIPIDOS, TIROIDEO, PCR, FE, PTHI, FERRITINA, DHL, FA)
          </button>
        </div>

        <!-- Botones de Laboratorio -->
        <div class="grid-labs" id="labButtonsContainer">
          <!-- Botones inyectados por JS -->
        </div>

        <!-- Previsualización del Desglose -->
        <div class="preview-box">
          <label>Análisis solicitados que se desglosarán en la solicitud:</label>
          <textarea id="txtEstudiosSolicitados" rows="3" placeholder="Selecciona los estudios arriba o escribe adicionales..."></textarea>
        </div>

      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="limpiarSeleccionLabs()">Limpiar Selección</button>
        <button class="btn btn-primary" onclick="imprimirSolicitudISSSTE()">🖨️ Generar e Imprimir Solicitud</button>
      </div>
    </div>
  </div>

  <!-- MODAL: BÚSQUEDA GLOBAL / REGISTRO DESDE LA BARRA SUPERIOR -->
  <div id="modalBusquedaTop" class="modal-overlay" style="display:none;">
    <div class="modal-content" style="max-width: 520px;">
      <div class="modal-header">
        <h3>Generar Solicitud de Laboratorio</h3>
        <button class="btn-close" onclick="cerrarModalBusquedaTop()">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>Buscar Paciente Registrado:</label>
          <input type="text" id="inputBuscarModal" class="form-control" placeholder="Escribe nombre o cama..." oninput="buscarPacientesEnModal()">
          <div id="listaResultadosModal" class="patient-search-results"></div>
        </div>

        <div style="text-align: center; margin: 15px 0; color: var(--text-muted); font-size: 0.85rem; font-weight: bold;">
          ── O REGISTRAR NUEVO PACIENTE ──
        </div>

        <button class="btn btn-outline" style="width: 100%; border-style: dashed;" onclick="cambiarANuevoPacienteDesdeBusqueda()">
          + Registrar Nuevo Paciente al Vuelo
        </button>
      </div>
    </div>
  </div>

  <!-- MODAL: REGISTRAR / EDITAR PACIENTE -->
  <div id="modalNuevoPaciente" class="modal-overlay" style="display:none;">
    <div class="modal-content" style="max-width: 560px;">
      <div class="modal-header">
        <h3 id="modalPacienteTitle">Registrar Paciente</h3>
        <button class="btn-close" onclick="cerrarModalNuevoPaciente()">✕</button>
      </div>
      <form id="formPaciente" onsubmit="guardarPaciente(event)">
        <div class="modal-body">
          <input type="hidden" id="pacienteId">
          <div class="form-row">
            <div class="form-group">
              <label>Cama *</label>
              <input type="text" id="pacCama" class="form-control" placeholder="Ej. 501" required>
            </div>
            <div class="form-group">
              <label>Expediente *</label>
              <input type="text" id="pacExp" class="form-control" placeholder="Ej. PORD690819/40" required>
            </div>
          </div>
          <div class="form-group">
            <label>Nombre Completo (Apellidos y Nombres) *</label>
            <input type="text" id="pacNombre" class="form-control" placeholder="Ej. AGUILERA MORA ROBERTO" required>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Edad</label>
              <input type="text" id="pacEdad" class="form-control" placeholder="Ej. 59">
            </div>
            <div class="form-group">
              <label>Sexo</label>
              <select id="pacSexo" class="form-control">
                <option value="M">Masculino (M)</option>
                <option value="F">Femenino (F)</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label>Diagnóstico Presuntivo</label>
            <input type="text" id="pacDx" class="form-control" value="ERC EN HD" placeholder="Diagnóstico principal">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" onclick="cerrarModalNuevoPaciente()">Cancelar</button>
          <button type="submit" class="btn btn-primary">Guardar Paciente</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ÁREA OCULTA PARA IMPRESIÓN (FORMATO ISSSTE DUPLICADO MEDIA CARTA) -->
  <div id="printableArea" style="display:none;"></div>

  <script>
    /* =====================================================================
       CONFIGURACIÓN DE FIREBASE
       ===================================================================== */
    // Sustituye con tus credenciales de tu consola Firebase si deseas conectar tu Firestore
    const firebaseConfig = {
      apiKey: "AIzaSyDummyKeyForNefroPaseISSSTE12345678",
      authDomain: "nefropase-cloud.firebaseapp.com",
      projectId: "nefropase-cloud",
      storageBucket: "nefropase-cloud.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcdef123456"
    };

    let db = null;
    try {
      if (typeof firebase !== 'undefined' && firebase.initializeApp) {
        firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
      }
    } catch(e) {
      console.warn("Firestore no inicializado directamente con keys reales, funcionando con almacenamiento local / memoria:", e);
    }

    /* =====================================================================
       CATÁLOGO DE LABORATORIOS Y DESGLOSES
       ===================================================================== */
    const LABS_CONFIG = [
      { id: 'bh', label: 'BH', desglose: 'BH' },
      { id: 'qs', label: 'Qs', desglose: 'Qs' },
      { id: 'es', label: 'Es completos', desglose: 'Na, K, Cl, Ca, P, Mg' },
      { id: 'pcr', label: 'PCR', desglose: 'PCR' },
      { id: 'alb', label: 'Albumina', desglose: 'Albumina' },
      { id: 'au', label: 'Ac urico', desglose: 'Ac urico' },
      { id: 'hba1c', label: 'Hb1Ac', desglose: 'Hb1Ac' },
      { id: 'tiempos', label: 'Tiempos de coagulacion', desglose: 'Tp, INR, Tpt' },
      { id: 'cpk', label: 'CPK', desglose: 'CPK' },
      { id: 'ckmb', label: 'CK-MB', desglose: 'CK-MB' },
      { id: 'trop', label: 'Troponina I', desglose: 'Troponina I' },
      { id: 'probnp', label: 'ProBNP', desglose: 'ProBNP' },
      { id: 'dimerod', label: 'Dimero D', desglose: 'Dimero D' },
      { id: 'fib', label: 'Fibrinogeno', desglose: 'Fibrinogeno' },
      { id: 'proca', label: 'Procalcitonina', desglose: 'Procalcitonina' },

      if (db) {
        db.collection("pacientes").onSnapshot((snapshot) => {
          if (!snapshot.empty) {
            const listaRemota = [];
            snapshot.forEach(doc => {
              listaRemota.push({ id: doc.id, ...doc.data() });
            });
            pacientes = listaRemota;
            cargarPacientes();
          }
        }, err => console.log("Firestore en modo offline/fallback"));

    /* =====================================================================
       RENDERIZADO DE PACIENTES
       ===================================================================== */
    function cargarPacientes(lista = pacientes) {
      const container = document.getElementById('pacientesContainer');
      container.innerHTML = '';

      if (lista.length === 0) {
        container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #64748b;">No se encontraron pacientes registrados o sincronizados.</div>`;
        return;
      }

      lista.forEach(p => {
        const card = document.createElement('div');
        card.className = 'patient-card';
        card.innerHTML = `
          <div class="card-header">
            <div>
              <div class="patient-name">${p.nombre}</div>
              <div class="patient-meta">Exp: <strong>${p.expediente || 'S/E'}</strong></div>
            </div>
            <span class="cama-badge">CAMA ${p.cama || 'S/C'}</span>
          </div>
          <div class="card-body">
            <div class="info-row">
              <span class="info-label">Edad / Sexo:</span>
              <span class="info-val">${p.edad || '--'} años / ${p.sexo || '--'}</span>
            </div>
            <div class="info-row">
              <span class="info-label">Servicio:</span>
              <span class="info-val">NEFROLOGIA</span>
            </div>
            <div class="dx-text" title="Diagnóstico Presuntivo">
              ${p.diagnostico || 'ERC EN HD'}

            <button class="btn-solicitud-card" onclick='abrirModalSolicitudLab(${JSON.stringify(p)})'>
              📋 Solicitar Laboratorios

          </div>
        `;
        container.appendChild(card);
      });
    }

    function filtrarPacientes() {
      const term = document.getElementById('filtroGeneral').value.toLowerCase().trim();
      const filtrados = pacientes.filter(p => 
        (p.nombre && p.nombre.toLowerCase().includes(term)) ||
        (p.cama && p.cama.toLowerCase().includes(term)) ||
        (p.expediente && p.expediente.toLowerCase().includes(term))
      );
      cargarPacientes(filtrados);
    }

    /* =====================================================================
       SELECTOR DE LABORATORIOS & BOTONES
       ===================================================================== */
    function renderizarBotonesLabs() {
      const cont = document.getElementById('labButtonsContainer');
      cont.innerHTML = '';

      LABS_CONFIG.forEach(lab => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'btn-lab-item';
        btn.id = `btn-lab-${lab.id}`;
        btn.innerText = lab.label;
        btn.onclick = () => toggleLabItem(lab);
        cont.appendChild(btn);
      });
    }

    function abrirModalSolicitudLab(paciente) {
      pacienteSeleccionadoParaLab = paciente;
      document.getElementById('modalLabHeader').innerText = 
        `Solicitud de Laboratorios: ${paciente.nombre} (Cama ${paciente.cama || 'S/C'})`;
      limpiarSeleccionLabs();
      document.getElementById('modalSolicitudLabs').style.display = 'flex';
    }

    function cerrarModalLabs() {
      document.getElementById('modalSolicitudLabs').style.display = 'none';
      pacienteSeleccionadoParaLab = null;
    }

    function toggleLabItem(lab) {
      if (selectedLabs.has(lab.id)) {
        selectedLabs.delete(lab.id);
        document.getElementById(`btn-lab-${lab.id}`).classList.remove('selected');
      } else {
        selectedLabs.set(lab.id, lab.desglose);
        document.getElementById(`btn-lab-${lab.id}`).classList.add('selected');
      }
      actualizarRutinaBotonStatus();
      actualizarPreviewTexto();
    }

    function toggleRutina() {
      const rutinaBtn = document.getElementById('btnRutina');
      const todosEstan = RUTINA_IDS.every(id => selectedLabs.has(id));

      if (todosEstan) {
        // Deseleccionar todos los de rutina
        RUTINA_IDS.forEach(id => {
          selectedLabs.delete(id);
          const b = document.getElementById(`btn-lab-${id}`);
          if (b) b.classList.remove('selected');
        });
        rutinaBtn.classList.remove('active');
      } else {
        // Seleccionar todos los de rutina
        RUTINA_IDS.forEach(id => {
          const item = LABS_CONFIG.find(l => l.id === id);
          if (item) {
            selectedLabs.set(item.id, item.desglose);
            const b = document.getElementById(`btn-lab-${id}`);
            if (b) b.classList.add('selected');
          }
        });
        rutinaBtn.classList.add('active');
      }
      actualizarPreviewTexto();
    }

    function actualizarRutinaBotonStatus() {
      const todosEstan = RUTINA_IDS.every(id => selectedLabs.has(id));
      const rutinaBtn = document.getElementById('btnRutina');
      if (todosEstan) {
        rutinaBtn.classList.add('active');
      } else {
        rutinaBtn.classList.remove('active');
      }
    }

    function actualizarPreviewTexto() {
      const texto = Array.from(selectedLabs.values()).join(', ');
      document.getElementById('txtEstudiosSolicitados').value = texto;
    }

    function limpiarSeleccionLabs() {
      selectedLabs.clear();
      document.querySelectorAll('.btn-lab-item').forEach(b => b.classList.remove('selected'));
      document.getElementById('btnRutina').classList.remove('active');
      document.getElementById('txtEstudiosSolicitados').value = '';
    }

    /* =====================================================================
       MODAL DE BÚSQUEDA GLOBAL DESDE LA BARRA SUPERIOR
       ===================================================================== */
    function abrirModalBusquedaSolicitud() {
      document.getElementById('inputBuscarModal').value = '';
      buscarPacientesEnModal();
      document.getElementById('modalBusquedaTop').style.display = 'flex';
    }

    function cerrarModalBusquedaTop() {
      document.getElementById('modalBusquedaTop').style.display = 'none';
    }

    function buscarPacientesEnModal() {
      const q = document.getElementById('inputBuscarModal').value.toLowerCase().trim();
      const listDiv = document.getElementById('listaResultadosModal');
      listDiv.innerHTML = '';

      const filtrados = pacientes.filter(p => 
        !q || p.nombre.toLowerCase().includes(q) || (p.cama && p.cama.toLowerCase().includes(q))
      );

      if (filtrados.length === 0) {
        listDiv.innerHTML = '<div style="padding: 10px; color: #94a3b8; text-align: center;">No se encontraron coincidencias.</div>';
        return;
      }

      filtrados.forEach(p => {
        const item = document.createElement('div');
        item.className = 'search-result-item';
        item.innerHTML = `
          <div>
            <strong>${p.nombre}</strong><br>
            <small style="color: #64748b;">Cama: ${p.cama || 'S/C'} | Exp: ${p.expediente || 'S/E'}</small>
          </div>
          <button class="btn btn-primary" style="padding: 4px 10px; font-size: 0.78rem;">Seleccionar</button>
        `;
        item.onclick = () => {
          cerrarModalBusquedaTop();
          abrirModalSolicitudLab(p);
        };
        listDiv.appendChild(item);
      });
    }

    function cambiarANuevoPacienteDesdeBusqueda() {
      cerrarModalBusquedaTop();
      abrirModalNuevoPaciente();
    }

    /* =====================================================================
       REGISTRO DE PACIENTE
       ===================================================================== */
    function abrirModalNuevoPaciente() {
      document.getElementById('formPaciente').reset();
      document.getElementById('pacienteId').value = '';
      document.getElementById('pacDx').value = 'ERC EN HD';
      document.getElementById('modalNuevoPaciente').style.display = 'flex';
    }

    function cerrarModalNuevoPaciente() {
      document.getElementById('modalNuevoPaciente').style.display = 'none';
    }

    function guardarPaciente(e) {
      e.preventDefault();
      const id = document.getElementById('pacienteId').value || 'pac_' + Date.now();
      const nuevo = {
        id: id,
        cama: document.getElementById('pacCama').value.trim(),
        expediente: document.getElementById('pacExp').value.trim(),
        nombre: document.getElementById('pacNombre').value.trim().toUpperCase(),
        edad: document.getElementById('pacEdad').value.trim(),
        sexo: document.getElementById('pacSexo').value,
        diagnostico: document.getElementById('pacDx').value.trim() || 'ERC EN HD'
      };

      const idx = pacientes.findIndex(p => p.id === id);
      if (idx >= 0) {
        pacientes[idx] = nuevo;
      } else {
        pacientes.unshift(nuevo);
      }

      if (db) {
        db.collection("pacientes").doc(nuevo.expediente.replace(/[^a-zA-Z0-9]/g, '_') || nuevo.id).set(nuevo, { merge: true });
      }

      cargarPacientes();
      cerrarModalNuevoPaciente();
      // Abrir inmediatamente modal de laboratorios para el paciente recién creado
      abrirModalSolicitudLab(nuevo);
    }
