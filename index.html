<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NefroPase Cloud - Hemodiálisis</title>
  
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-light: #3b82f6;
      --secondary: #0f766e;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #cbd5e1;
      --danger: #b91c1c;
      --warning: #b45309;
      --success: #15803d;
      --shadow: 0 2px 6px -1px rgba(0,0,0,0.08), 0 2px 4px -2px rgba(0,0,0,0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 70px; }

    /* --- CONTROL STRIP SUPERIOR --- */
    .control-strip {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #ffffff;
      border-bottom: 2px solid var(--border);
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: var(--shadow);
    }

    .strip-line-1 {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .strip-line-1 select,
    .strip-line-1 input {
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.85rem;
      background-color: #f1f5f9;
      color: var(--text);
      font-weight: 500;
      outline: none;
    }

    .strip-line-1 select:focus,
    .strip-line-1 input:focus {
      border-color: var(--primary-light);
      background-color: #fff;
    }

    .search-input {
      flex: 1 1 180px;
      min-width: 140px;
    }

    .badge-counter {
      background-color: var(--primary);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 999px;
      white-space: nowrap;
    }

    /* LÍNEA 2: BOTONES EN UNA SOLA LÍNEA CONTINUA (SCROLL HORIZONTAL MÓVIL) */
    .strip-line-2 {
      display: flex !important;
      flex-direction: row !important;
      flex-wrap: nowrap !important;
      overflow-x: auto !important;
      overflow-y: hidden !important;
      -webkit-overflow-scrolling: touch;
      gap: 6px;
      padding-bottom: 2px;
      scrollbar-width: none; /* Firefox */
      -ms-overflow-style: none; /* Edge */
    }

    .strip-line-2::-webkit-scrollbar {
      display: none; /* Chrome, Safari */
    }

    .btn-action {
      flex: 0 0 auto !important;
      white-space: nowrap !important;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--text);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      transition: background 0.15s;
    }

    .btn-action:active { background: #e2e8f0; }

    /* --- CONTENEDOR PRINCIPAL --- */
    .container {
      max-width: 1100px;
      margin: 12px auto;
      padding: 0 10px;
    }

    /* --- TARJETAS DEL CENSO --- */
    .grid-patients {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 12px;
    }

    .patient-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .patient-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid #f1f5f9;
      padding-bottom: 6px;
    }

    .patient-name {
      font-size: 1rem;
      font-weight: 700;
      color: var(--primary);
      cursor: pointer;
    }

    .patient-nss {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .quick-params {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      font-size: 0.78rem;
      background: #f8fafc;
      padding: 6px;
      border-radius: 6px;
      text-align: center;
    }

    .quick-params div span { display: block; color: var(--text-muted); font-size: 0.7rem; }

    /* --- FICHA / DETALLE DE PACIENTE --- */
    #patientDetailView {
      display: none;
      background: #fff;
      border-radius: 8px;
      border: 1px solid var(--border);
      padding: 16px;
      box-shadow: var(--shadow);
    }

    .detail-nav-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 8px;
    }

    .btn-return {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .form-group label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .form-group input, .form-group select, .form-group textarea {
      padding: 7px;
      border: 1px solid var(--border);
      border-radius: 5px;
      font-size: 0.85rem;
    }

    textarea.note-area {
      width: 100%;
      height: 90px;
      resize: vertical;
      font-size: 0.85rem;
      line-height: 1.4;
    }

    .section-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--secondary);
      margin: 12px 0 6px 0;
      border-left: 3px solid var(--secondary);
      padding-left: 6px;
    }

    /* --- MODALES COMPACTOS --- */
    .modal-backdrop {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.6);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }

    .modal-content {
      background: #ffffff;
      border-radius: 8px;
      max-width: 650px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 8px;
    }

    .modal-title { font-size: 1.05rem; font-weight: 700; color: var(--primary); }

    /* Cuadrícula compacta de 2 columnas para pendientes */
    .pending-grid-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      align-items: flex-end;
    }

    .sync-indicator {
      font-size: 0.72rem;
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .sync-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--success);
    }
  </style>
